<!DOCTYPE html>
<html>

<body>
    <h3> print even numbers from 1 to 50</h3>
    <div id="root"></div>

    <script>
        let output = "";

        for (let i = 2; i <= 50; i += 2) {
            output += i + " ";
        }

        document.getElementById("root").innerHTML = output;
    </script>
</body>

</html>
