<!DOCTYPE html>
<html>

<body>
    <h3>Numbers from 1 to 100</h3>
    <div id="root"></div>

    <script>
        let output = "";

        for (let i = 1; i <= 100; i++) {
            output += i + ",";
        }

        document.getElementById("root").innerHTML = output;
    </script>
</body>

</html>
