<!DOCTYPE html>
<html>

<body>
    <h3>Discount Calculator</h3>
    <div id="root"></div>

    <script>
        let amount = Number(prompt("Enter purchase amount:"));
        let discount;

        if (amount < 0) {
            document.getElementById("root").innerHTML =
                "Invalid Amount";
        } else {
            if (amount >= 5000) {
                discount = amount * 20 / 100;
            } else if (amount >= 2000) {
                discount = amount * 10 / 100;
            } else {
                discount = 0;
            }

            document.getElementById("root").innerHTML =
                "Purchase Amount = " + amount +
                "<br>Discount = " + discount +
                "<br>Final Amount = " + (amount - discount);
        }
    </script>
</body>

</html>
