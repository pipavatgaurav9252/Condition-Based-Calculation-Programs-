<!DOCTYPE html>
<html>

<body>
    <h3>Multiplication Table</h3>
    <div id="root"></div>

    <script>
        let num = Number(prompt("Enter a number:"));
        let output = "";

        for (let i = 1; i <= 10; i++) {
            output += num + " * " + i + " = "
                + (num * i) + "<br>";
        }

        document.getElementById("root").innerHTML = output;
    </script>
</body>

</html>
