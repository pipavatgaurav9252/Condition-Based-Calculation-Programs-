<!DOCTYPE html>
<html>

<body>
    <h3>Grade Checker</h3>
    <div id="root"></div>

    <script>
        let marks = Number(prompt("Enter your marks:"));
        let grade;

        if (marks < 0 || marks > 100) {
            grade = "Invalid Marks";
        } else if (marks >= 90) {
            grade = "Grade A";
        } else if (marks >= 75) {
            grade = "Grade B";
        } else if (marks >= 60) {
            grade = "Grade C";
        } else if (marks >= 35) {
            grade = "Grade D";
        } else {
            grade = "Fail";
        }

        document.getElementById("root").innerHTML = grade;
    </script>
</body>

</html>
